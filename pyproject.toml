[project]
name = "personaos"
version = "0.1.0"
description = "PersonaOS: One Identity. One Memory. Infinite Intelligence."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real external provider (LLM, Google, Firebase); excluded by default",
]
asyncio_default_fixture_loop_scope = "function"
